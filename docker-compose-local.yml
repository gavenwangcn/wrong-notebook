# 从当前仓库源码构建镜像并启动服务端（生产模式 standalone，非 npm run dev）。
# 适用：Linux Ubuntu 22.04 等已安装 Docker Engine 与 Compose 插件的环境。
#
# 首次使用：
#   mkdir -p data config
#   cp .env.example .env   # 编辑 NEXTAUTH_SECRET、NEXTAUTH_URL
#   docker compose -f docker-compose-local.yml build
#   docker compose -f docker-compose-local.yml up -d
#
# 代码更新后重建并重启（数据保留在 ./data、./config）：
#   docker compose -f docker-compose-local.yml build
#   docker compose -f docker-compose-local.yml up -d --force-recreate
#
# 登录页「下载移动版本」：把 APK 放在宿主机 ./dist/，compose 会只读挂载到容器 /app/dist（勿在 .env 写宿主机路径）。
#
# 环境变量：Compose 会读取同目录 .env 用于 ${VAR} 替换（不要把整个 .env env_file 挂进容器，
# 否则 DATABASE_URL=file:./dev.db 会覆盖镜像内的 file:/app/data/dev.db）。
#
# 可选构建参数（export 后再 build）：
#   APP_REVISION、APP_VERSION — 镜像标签与 /api/health 展示（默认 unknown / package.json）
#   TEST_TIMEOUT_MS — 镜像内 Vitest 超时，慢机器可设为 120000
#   HTTP_PROXY、HTTPS_PROXY、NO_PROXY — 构建阶段拉依赖时使用
#   NODE_IMAGE — 默认 node:24-alpine

services:
  wrong-notebook:
    image: wrong-notebook:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
        APP_VERSION: ${APP_VERSION:-}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        TEST_TIMEOUT_MS: ${TEST_TIMEOUT_MS:-5000}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: wrong-notebook
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 与浏览器访问地址一致（在 .env 里设置 NEXTAUTH_URL）
      NEXTAUTH_URL: ${NEXTAUTH_URL:?请在 .env 中设置 NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?请在 .env 中设置 NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 容器内路径；宿主机 ./dist 见下方 volumes（不要写成 /root/... 这类宿主机路径）
      MOBILE_APK_DIR: /app/dist
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./dist:/app/dist:ro

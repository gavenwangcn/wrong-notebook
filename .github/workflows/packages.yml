name: Packages

# 全平台安装包：npm、Windows、macOS、Linux、飞牛OS、安卓（手机版、平板版）
# Prisma 引擎与构建机平台绑定，因此每个平台在对应架构的 Runner 上分别构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  npm:
    name: npm
    runs-on: ubuntu-24.04
    # 只在 GitHub 上运行；Gitea 读取 main 时会回退到本目录，需跳过
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Build bundle and npm package
        run: |
          node scripts/package/build.mjs bundle
          node scripts/package/build.mjs npm

      - name: Smoke test npm package
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          data="$(mktemp -d)"
          npm install -g --prefix "$prefix" ./dist/wrong-notebook-*.tgz
          "$prefix/bin/wrong-notebook" --port 39400 --host 127.0.0.1 --data-dir "$data" > "$data/server.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:39400/api/health; then exit 0; fi
            sleep 1
          done
          cat "$data/server.log"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: package-npm
          path: dist/wrong-notebook-*.tgz
          if-no-files-found: error

  # 发布单独成一个 Job：npm 发布失败不影响安装包上传到 Release
  # 使用 npm Trusted Publishing（OIDC），无需 NPM_TOKEN；需在 npmjs.com 包设置中登记本仓库的 packages.yml
  npm-publish:
    name: Publish to npm
    needs: npm
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted Publishing 需要 npm 11.5.1 及以上，Node.js 24 自带
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: package-npm
          path: dist

      - name: Publish
        shell: bash
        run: |
          npm --version
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          # OIDC 换取令牌失败时 npm 只在 verbose 日志中说明原因，这里筛出认证相关的行
          npm publish ./dist/wrong-notebook-*.tgz --access public --provenance --tag "$tag" --loglevel verbose 2>&1 \
            | grep -viE '^npm (notice|verbose) +[0-9.]+[kMB]* ' \
            | grep -iE 'oidc|trust|token|auth|provenance|publish|error|^\+ '

  desktop:
    name: Desktop (${{ matrix.name }})
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
          - name: macos-x64
            os: macos-15-intel
            args: --mac --x64
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # electron-builder 自带的 fpm 只有 x86_64 版本，arm64 上改用系统 fpm 生成 deb
      - name: Install fpm (linux arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build bundle
        run: node scripts/package/build.mjs bundle

      - name: Build desktop installers (unsigned)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/package/build.mjs desktop ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-desktop-${{ matrix.name }}
          path: |
            dist/desktop/release/WrongNotebook-*.exe
            dist/desktop/release/WrongNotebook-*.dmg
            dist/desktop/release/WrongNotebook-*.zip
            dist/desktop/release/WrongNotebook-*.AppImage
            dist/desktop/release/WrongNotebook-*.deb
          if-no-files-found: error

  fnos:
    name: fnOS (${{ matrix.arch }})
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            os: ubuntu-24.04
            fnpack: fnpack-1.2.1-linux-amd64
            sha256: 72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1
          - arch: arm
            os: ubuntu-24.04-arm
            fnpack: fnpack-1.2.1-linux-arm64
            sha256: aad9e16b101267d30017f39ab969e3c085fbce209716f8bd3b1e167eaf15e0cf
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Install fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/${{ matrix.fnpack }}"
          echo "${{ matrix.sha256 }}  /usr/local/bin/fnpack" | sha256sum -c -
          chmod +x /usr/local/bin/fnpack

      - run: npm ci

      - name: Build fpk
        run: |
          node scripts/package/build.mjs bundle
          node scripts/package/build.mjs fnos --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-fnos-${{ matrix.arch }}
          path: dist/WrongNotebook-FnOS-*.fpk
          if-no-files-found: error

  android:
    name: Android
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runner 镜像自带 Android SDK（ANDROID_HOME），缺少的平台和构建工具由 Android Gradle 插件自动下载
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # 发布版必须使用固定的签名密钥，否则用户无法覆盖安装升级
      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::未配置 ANDROID_KEYSTORE_BASE64，发布版 APK 必须使用固定签名，见 doc/INSTALL_PACKAGES.md"
            exit 1
          else
            echo "::warning::未配置签名密钥，APK 使用调试签名，仅供测试"
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/package/build.mjs android

      - name: Verify signatures
        shell: bash
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in dist/WrongNotebook-Android-*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: dist/WrongNotebook-Android-*.apk
          if-no-files-found: error

  release:
    name: Upload to Release
    needs: [npm, desktop, fnos, android]
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: package-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release 通常已由 release.yml 创建；不存在时先创建
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber --repo "$GITHUB_REPOSITORY"
